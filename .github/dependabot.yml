version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
  ignore:
    # Maven wrapper: stay on the Maven 3 line, no 4.x (including 4.0.0 pre-releases)
    - dependency-name: org.apache.maven:apache-maven
      update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
