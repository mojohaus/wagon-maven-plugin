version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: monthly
  groups:
    maven:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
    - dependency-name: "org.apache.maven:maven-artifact"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-core"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-plugin-api"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-repository-metadata"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-settings"
      versions: [">= 3.10.0"]
    # Maven Wrapper: stay on Maven 3.9.x
    - dependency-name: "org.apache.maven:apache-maven"
      versions: [">= 3.10.0"]
    # plexus-xml 4.x is the Maven 4 line (depends on maven-xml-impl 4.0.0-alpha)
    - dependency-name: "org.codehaus.plexus:plexus-xml"
      versions: [">= 4.0.0"]
    # Maven 3.9.x core exports slf4j-api 1.7.36
    - dependency-name: "org.slf4j:*"
      versions: [">= 2.0.0"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]
