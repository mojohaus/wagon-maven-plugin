version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: monthly
  groups:
    maven:
      update-types: ["minor", "patch"]
  ignore:
    # Maven wrapper: stay on the Maven 3 line, no 4.x (including 4.0.0 pre-releases)
    - dependency-name: org.apache.maven:apache-maven
      update-types: ["version-update:semver-major"]
    # plexus-xml 4.x is the Maven 4 line (depends on maven-xml-impl 4.0.0-alpha)
    - dependency-name: "org.codehaus.plexus:plexus-xml"
      versions: [">= 4.0.0"]
    # Maven 3.9.x core exports slf4j-api 1.7.36
    - dependency-name: "org.slf4j:*"
      versions: [">= 2.0.0"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]
